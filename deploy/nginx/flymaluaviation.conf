# Malu Aviation — nginx site configuration
#
# One origin serves both halves: the React build at /, and the .NET API at
# /api. That is what lets the refresh cookie stay SameSite=Strict and makes
# CORS irrelevant, so keeping this shape matters more than it looks.
#
#   /etc/nginx/sites-available/flymaluaviation.conf
#   ln -s ../sites-available/flymaluaviation.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Assumes the API runs on 127.0.0.1:5000 (ASPNETCORE_URLS=http://127.0.0.1:5000)
# and the React build is deployed to /var/www/flymaluaviation.

upstream malu_api {
    server 127.0.0.1:5000;

    # Reuse connections to Kestrel instead of opening one per request.
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP: redirect everything, except the ACME challenge certbot needs to renew.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name flymaluaviation.com www.flymaluaviation.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://flymaluaviation.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Canonical host. www redirects to the apex so there is one origin, not two —
# the refresh cookie is issued for whichever host set it, and a user bouncing
# between the two would appear signed out on one of them.
# ---------------------------------------------------------------------------

server {
    # "listen ... http2" rather than the newer "http2 on;" directive: the latter
    # needs nginx 1.25.1+, and on anything older it is not a warning but a fatal
    # unknown-directive error. Ubuntu 22.04 LTS still ships 1.18. This form works
    # from 1.9.5 onwards and only warns as deprecated on the newest releases.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flymaluaviation.com;

    ssl_certificate     /etc/letsencrypt/live/flymaluaviation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flymaluaviation.com/privkey.pem;

    return 301 https://flymaluaviation.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flymaluaviation.com;

    root /var/www/flymaluaviation;
    index index.html;

    # ---- TLS ----

    ssl_certificate     /etc/letsencrypt/live/flymaluaviation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flymaluaviation.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No OCSP stapling here on purpose. It needs a "resolver" directive to fetch
    # the response, and without one nginx warns at startup and then serves every
    # request unstapled — a setting that reads as on and is off. Let's Encrypt is
    # also retiring its OCSP responders, so there is progressively less to
    # staple. If you do add it back, add a resolver in the same commit.

    # ---- limits ----

    # Every request this API accepts is small JSON. The largest realistic body
    # is a nine-passenger booking, well under 8 KB. A low ceiling costs nothing
    # and removes a whole class of resource-exhaustion attempt.
    client_max_body_size 64k;

    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ---- compression ----

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/problem+json
        image/svg+xml;

    # -----------------------------------------------------------------------
    # API
    # -----------------------------------------------------------------------

    location /api/ {
        proxy_pass http://malu_api;
        proxy_http_version 1.1;

        # Set, not appended. $proxy_add_x_forwarded_for would carry through
        # whatever the client sent, and the app partitions its rate limiters on
        # this value — a forged header would let one caller spread an attack
        # across unlimited buckets.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Host              $host;
        proxy_set_header Connection        "";

        # Kestrel is on the same host, so these only need to cover a slow query,
        # not a slow network.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # No caching of API responses, whatever headers the app sends.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Stripe webhook
    # -----------------------------------------------------------------------

    # Separated only to be explicit about one thing: the signature is computed
    # over the exact bytes Stripe sent, so nothing may alter the body. nginx
    # does not rewrite request bodies, but gzip and any future body-touching
    # module would, and this is where someone would add one.
    location = /api/payments/webhook {
        proxy_pass http://malu_api;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";

        # Stripe retries with backoff; give a slow confirmation room to finish
        # rather than making it retry a request that would have succeeded.
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # React build
    # -----------------------------------------------------------------------
    #
    # add_header does NOT accumulate down the tree: a block defining any
    # add_header of its own inherits none from its parent. So every block below
    # that sets a header has to restate the security ones. Dropping them from a
    # block is silent — the response simply goes out without them.
    #
    # Cache-Control is written with add_header rather than "expires" for a
    # related reason: "expires" emits its own Cache-Control, so using both sends
    # the header twice with different values.

    # Vite fingerprints these, so the name changes whenever the content does.
    # They can be cached hard and forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # Client-side routing: /nos-avions and /reserver are not files, so
        # anything not on disk falls back to the app shell.
        try_files $uri $uri/ /index.html;

        # The site's Content-Security-Policy lives in a meta tag in index.html,
        # but frame-ancestors is ignored there — browsers only honour it from a
        # header. This is what actually stops the site being framed.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # try_files above falls back by internally redirecting to /index.html, and an
    # internal redirect re-runs location matching — so this block, not the one
    # above, is what actually serves every client-side route. It has to carry the
    # security headers itself for that reason.
    #
    # index.html must never be cached: it names the fingerprinted bundles, and a
    # stale copy points at files the last deploy deleted — a blank page that
    # clears only when the user hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Nothing here should ever be fetched.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
